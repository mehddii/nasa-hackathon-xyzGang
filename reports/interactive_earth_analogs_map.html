        "mars_utopia_planitia_permafrost": "Mars: Utopia Planitia (Ground Ice)"
    };

    // Satellite Base Layer (Esri World Imagery)
    const esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {

    });

    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    });

    const map = L.map('map', {
        center: [20.0, 0.0],
        zoom: 3,
        layers: [esriSat]
    });

    const baseMaps = {
        "Satellite Imagery (Esri)": esriSat,
        "OpenStreetMap": osm
    };
    L.control.layers(baseMaps).addTo(map);

    // Add Markers from GeoJSON
    L.geoJSON(geojsonData, {
        pointToLayer: function (feature, latlng) {
            const tid = feature.properties.target_id;
            const color = missionColors[tid] || "#2563eb";
            return L.circleMarker(latlng, {
                radius: feature.properties.rank === 1 ? 11 : 8,
                fillColor: color,
                color: "#ffffff",
                weight: feature.properties.rank === 1 ? 3 : 1.5,
                opacity: 1,
                fillOpacity: 0.9
            });
        },
        onEachFeature: function (feature, layer) {
            const p = feature.properties;
            const tid = p.target_id;
            const color = missionColors[tid] || "#2563eb";
            const gmapsUrl = `https://www.google.com/maps?q=${feature.geometry.coordinates[1]},${feature.geometry.coordinates[0]}&t=k`;
            
            const popupContent = `
                <div class="custom-popup">
                    <div class="popup-title">${p.name}</div>
                    <span class="popup-badge" style="background:${color};">${p.target_body} &bull; Rank #${p.rank}</span>
                    <div class="popup-info">

                        <strong>Coordinates:</strong> ${feature.geometry.coordinates[1].toFixed(3)}°N, ${feature.geometry.coordinates[0].toFixed(3)}°E<br/>
                        <strong>Fidelity Score:</strong> ${(p.fidelity_score * 100).toFixed(1)}% (PSI: ${p.psi_score}, TOPSIS: ${p.topsis_score})<br/>
                        <strong>Geology:</strong> ${p.primary_geology}<br/>
                        <strong>Role:</strong> ${p.benchmark_role}
                    </div>
                    <a href="${gmapsUrl}" target="_blank" class="popup-link">Open in Google Satellite &rarr;</a>
                </div>
            `;
            layer.bindPopup(popupContent);
        }
    }).addTo(map);

    const legend = L.control({position: 'bottomleft'});
    legend.onAdd = function (map) {
        const div = L.DomUtil.create('div', 'legend');
        div.innerHTML = '<h4>NASA Exploration Targets</h4>';
        for (const [key, name] of Object.entries(missionNames)) {
            const color = missionColors[key];
            div.innerHTML += `
                <div class="legend-item">
                    <span class="legend-color" style="background:${color};"></span>
                    <span>${name}</span>
                </div>
            `;
        }
        return div;
    };
    legend.addTo(map);
